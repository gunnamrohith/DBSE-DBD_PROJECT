<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Haven Society Management ER diagram and database design</title>
  <desc id="description">Compact entity relationship diagram of ten MySQL tables with a database design summary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#71879a"/>
    </marker>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#e8f5fb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#b9d7e6" stroke-width="1" opacity="0.25"/>
    </pattern>
    <style>
      .heading { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #17324d; font-weight: 800; }
      .body { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #607486; }
      .entity-title { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #fff; font-size: 15px; font-weight: 800; }
      .field { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #334b5f; font-size: 13px; }
      .key { font-weight: 800; fill: #df563e; }
      .relation { fill: none; stroke: #71879a; stroke-width: 2; marker-end: url(#arrow); }
      .card-title { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #17324d; font-size: 18px; font-weight: 800; }
      .card-copy { font-family: Avenir Next, Trebuchet MS, sans-serif; fill: #607486; font-size: 14px; }
    </style>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#background)"/>
  <rect width="1600" height="720" rx="34" fill="url(#grid)"/>
  <text x="64" y="64" class="heading" font-size="32">ER DIAGRAM &amp; DATABASE DESIGN</text>
  <text x="64" y="98" class="body" font-size="17">Relational MySQL model · 10 entities · secure and consistent records</text>
  <rect x="64" y="118" width="100" height="6" rx="3" fill="#ef6a51"/>

  <rect x="52" y="150" width="1060" height="520" rx="22" fill="#fff" stroke="#d3e4ec" stroke-width="2"/>
  <text x="80" y="188" class="heading" font-size="18">RELATIONSHIP MODEL</text>
  <text x="950" y="188" class="body" font-size="13"><tspan class="key">PK</tspan> primary key   ·   <tspan fill="#2870a8" font-weight="800">FK</tspan> foreign key</text>

  <g>
    <path class="relation" d="M257 296H321"/>
    <path class="relation" d="M174 344v64"/>
    <path class="relation" d="M257 306C286 320 291 420 321 430"/>
    <path class="relation" d="M257 326C286 354 291 546 321 568"/>
    <path class="relation" d="M496 268h65"/>
    <path class="relation" d="M496 290C526 300 531 398 561 408"/>
    <path class="relation" d="M496 316C520 330 520 486 545 486H760C780 486 780 456 804 456"/>
    <path class="relation" d="M350 344C286 360 286 486 350 500"/>
    <path class="relation" d="M496 430h65"/>
    <path class="relation" d="M257 592h64"/>
    <path class="relation" d="M951 318v80"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(92 238)">
      <rect width="165" height="106" rx="11" fill="#fff" stroke="#3180ba" stroke-width="2"/>
      <path d="M11 0h143a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#3180ba"/>
      <text x="14" y="24" class="entity-title">FLATS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  flat_id</text>
      <text x="14" y="82" class="field">flat_number</text>
      <text x="14" y="101" class="field">block_name</text>
    </g>

    <g transform="translate(321 214)">
      <rect width="175" height="130" rx="11" fill="#fff" stroke="#ef6a51" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#ef6a51"/>
      <text x="14" y="24" class="entity-title">RESIDENTS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  resident_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  flat_id</text>
      <text x="14" y="105" class="field">email · role</text>
    </g>

    <g transform="translate(561 214)">
      <rect width="175" height="104" rx="11" fill="#fff" stroke="#8aa0b2" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#607b91"/>
      <text x="14" y="24" class="entity-title">COMPLAINTS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  complaint_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  resident_id</text>
    </g>

    <g transform="translate(804 214)">
      <rect width="175" height="104" rx="11" fill="#fff" stroke="#22a17e" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#22a17e"/>
      <text x="14" y="24" class="entity-title">AMENITIES</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  amenity_id</text>
      <text x="14" y="82" class="field">availability_status</text>
    </g>

    <g transform="translate(92 408)">
      <rect width="165" height="104" rx="11" fill="#fff" stroke="#8aa0b2" stroke-width="2"/>
      <path d="M11 0h143a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#607b91"/>
      <text x="14" y="24" class="entity-title">VISITORS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  visitor_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  flat_id</text>
    </g>

    <g transform="translate(321 378)">
      <rect width="175" height="104" rx="11" fill="#fff" stroke="#f0aa37" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#d89626"/>
      <text x="14" y="24" class="entity-title">MAINTENANCE</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  bill_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  flat_id</text>
    </g>

    <g transform="translate(561 350)">
      <rect width="175" height="116" rx="11" fill="#fff" stroke="#8aa0b2" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#607b91"/>
      <text x="14" y="24" class="entity-title">PAYMENTS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  payment_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  bill_id</text>
      <text x="14" y="103" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  resident_id</text>
    </g>

    <g transform="translate(804 398)">
      <rect width="175" height="116" rx="11" fill="#fff" stroke="#22a17e" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#22a17e"/>
      <text x="14" y="24" class="entity-title">BOOKINGS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  booking_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  resident_id</text>
      <text x="14" y="103" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  amenity_id</text>
    </g>

    <g transform="translate(92 548)">
      <rect width="165" height="88" rx="11" fill="#fff" stroke="#8aa0b2" stroke-width="2"/>
      <path d="M11 0h143a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#607b91"/>
      <text x="14" y="24" class="entity-title">STAFF</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  staff_id</text>
      <text x="14" y="80" class="field">staff_type</text>
    </g>

    <g transform="translate(321 500)">
      <rect width="175" height="136" rx="11" fill="#fff" stroke="#ef6a51" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#ef6a51"/>
      <text x="14" y="24" class="entity-title">APP USERS</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  user_id</text>
      <text x="14" y="82" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  resident_id</text>
      <text x="14" y="103" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  staff_id</text>
      <text x="14" y="124" class="field"><tspan fill="#2870a8" font-weight="800">FK</tspan>  flat_id</text>
    </g>

    <g transform="translate(561 504)">
      <rect width="175" height="104" rx="11" fill="#fff" stroke="#8aa0b2" stroke-width="2"/>
      <path d="M11 0h153a11 11 0 0111 11v25H0V11A11 11 0 0111 0z" fill="#607b91"/>
      <text x="14" y="24" class="entity-title">NOTICES</text>
      <text x="14" y="59" class="field"><tspan class="key">PK</tspan>  notice_id</text>
      <text x="14" y="82" class="field">notice_date</text>
    </g>
  </g>

  <g transform="translate(1144 150)">
    <rect width="404" height="520" rx="22" fill="#ffffff" stroke="#c9dfe9" stroke-width="2"/>
    <rect width="404" height="12" rx="6" fill="#3180ba"/>
    <text x="30" y="48" fill="#17324d" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="20" font-weight="800">DATABASE DESIGN</text>
    <text x="30" y="75" fill="#607486" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14">Compact design decisions</text>

    <g transform="translate(24 102)">
      <rect width="356" height="82" rx="13" fill="#e9f4fc" stroke="#bad9ed"/>
      <circle cx="42" cy="41" r="21" fill="#3481bd"/>
      <text x="42" y="46" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="15" font-weight="700">3NF</text>
      <text x="78" y="32" class="card-title">Normalized Structure</text>
      <text x="78" y="56" class="card-copy">Separate entities reduce duplication.</text>
    </g>

    <g transform="translate(24 201)">
      <rect width="356" height="82" rx="13" fill="#fff0ec" stroke="#f2c9c1"/>
      <circle cx="42" cy="41" r="21" fill="#ef6a51"/>
      <text x="42" y="47" text-anchor="middle" fill="#fff" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="16" font-weight="800">FK</text>
      <text x="78" y="32" class="card-title">Referential Integrity</text>
      <text x="78" y="56" class="card-copy">Foreign keys prevent orphan records.</text>
    </g>

    <g transform="translate(24 300)">
      <rect width="356" height="82" rx="13" fill="#e8f7f2" stroke="#bce0d7"/>
      <circle cx="42" cy="41" r="21" fill="#22a17e"/>
      <path d="M32 41l7 7 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="32" class="card-title">Data Constraints</text>
      <text x="78" y="56" class="card-copy">UNIQUE, ENUM and CHECK rules.</text>
    </g>

    <g transform="translate(24 399)">
      <rect width="356" height="82" rx="13" fill="#fff5df" stroke="#efd6a4"/>
      <circle cx="42" cy="41" r="21" fill="#d89626"/>
      <path d="M31 49h22M34 42h16M38 35h8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="78" y="32" class="card-title">Fast Data Access</text>
      <text x="78" y="56" class="card-copy">Indexed keys support quick queries.</text>
    </g>
  </g>
</svg>