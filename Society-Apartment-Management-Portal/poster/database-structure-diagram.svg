    <text x="14" y="78" class="pk">PK</text><text x="58" y="78" class="field">amenity_id</text><text x="220" y="78" class="type">INT UNSIGNED</text>
    <text x="58" y="115" class="field">amenity_name</text><text x="220" y="115" class="type">VARCHAR(100)</text>
    <text x="58" y="152" class="field">location</text><text x="220" y="152" class="type">VARCHAR(100)</text>
    <text x="58" y="189" class="field">availability_status</text><text x="220" y="189" class="type">ENUM</text>
  </g>

  <g transform="translate(1200 365)" filter="url(#shadow)">
    <rect class="box" width="370" height="230" rx="8"/><path class="header" d="M8 0h354a8 8 0 018 8v31H0V8a8 8 0 018-8z"/>
    <text x="185" y="26" text-anchor="middle" class="table-name">amenity_bookings</text>
    <path class="rule" d="M0 39h370M48 39v191M210 39v191"/>
    <text x="14" y="62" class="pk">PK</text><text x="58" y="62" class="field">booking_id</text><text x="220" y="62" class="type">INT UNSIGNED</text>
    <text x="14" y="86" class="fk">FK</text><text x="58" y="86" class="field">resident_id</text><text x="220" y="86" class="type">INT UNSIGNED</text>
    <text x="14" y="110" class="fk">FK</text><text x="58" y="110" class="field">amenity_id</text><text x="220" y="110" class="type">INT UNSIGNED</text>
    <text x="58" y="134" class="field">booking_date</text><text x="220" y="134" class="type">DATE</text>
    <text x="58" y="158" class="field">start_time</text><text x="220" y="158" class="type">TIME</text>
    <text x="58" y="182" class="field">end_time</text><text x="220" y="182" class="type">TIME</text>
    <text x="58" y="206" class="field">booking_status</text><text x="220" y="206" class="type">ENUM</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(30 618)" filter="url(#shadow)">
    <rect class="box" width="370" height="250" rx="8"/><path class="header" d="M8 0h354a8 8 0 018 8v31H0V8a8 8 0 018-8z"/>
    <text x="185" y="26" text-anchor="middle" class="table-name">visitors</text>
    <path class="rule" d="M0 39h370M48 39v211M210 39v211"/>
    <text x="14" y="62" class="pk">PK</text><text x="58" y="62" class="field">visitor_id</text><text x="220" y="62" class="type">INT UNSIGNED</text>
    <text x="58" y="86" class="field">visitor_name</text><text x="220" y="86" class="type">VARCHAR(100)</text>
    <text x="58" y="110" class="field">phone</text><text x="220" y="110" class="type">VARCHAR(15)</text>
    <text x="58" y="134" class="field">purpose</text><text x="220" y="134" class="type">VARCHAR(100)</text>
    <text x="14" y="158" class="fk">FK</text><text x="58" y="158" class="field">flat_id</text><text x="220" y="158" class="type">INT UNSIGNED</text>
    <text x="58" y="182" class="field">entry_time</text><text x="220" y="182" class="type">DATETIME</text>
    <text x="58" y="206" class="field">exit_time</text><text x="220" y="206" class="type">DATETIME</text>
    <text x="58" y="230" class="field">status</text><text x="220" y="230" class="type">ENUM</text>
  </g>

  <g transform="translate(420 618)" filter="url(#shadow)">
