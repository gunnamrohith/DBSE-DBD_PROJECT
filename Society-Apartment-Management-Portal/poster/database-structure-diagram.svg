    <text x="185" y="26" text-anchor="middle" class="table-name">notices</text>
    <path class="rule" d="M0 39h370M48 39v211M210 39v211"/>
    <text x="14" y="82" class="pk">PK</text><text x="58" y="82" class="field">notice_id</text><text x="220" y="82" class="type">INT UNSIGNED</text>
    <text x="58" y="125" class="field">notice_title</text><text x="220" y="125" class="type">VARCHAR(100)</text>
    <text x="58" y="168" class="field">notice_description</text><text x="220" y="168" class="type">VARCHAR(500)</text>
    <text x="58" y="211" class="field">notice_date</text><text x="220" y="211" class="type">DATE</text>
