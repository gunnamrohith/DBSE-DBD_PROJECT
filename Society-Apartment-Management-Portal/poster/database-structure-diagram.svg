    <path class="rule" d="M0 39h760M48 39v211M215 39v211M380 39v211M428 39v211M590 39v211"/>
    <text x="14" y="72" class="pk">PK</text><text x="58" y="72" class="field">user_id</text><text x="225" y="72" class="type">INT UNSIGNED</text>
    <text x="58" y="106" class="field">name</text><text x="225" y="106" class="type">VARCHAR(100)</text>
    <text x="58" y="140" class="field">email</text><text x="225" y="140" class="type">VARCHAR(120)</text>
    <text x="58" y="174" class="field">password_hash</text><text x="225" y="174" class="type">VARCHAR(255)</text>
    <text x="58" y="208" class="field">role</text><text x="225" y="208" class="type">ENUM</text>
    <text x="390" y="72" class="field">account_type</text><text x="600" y="72" class="type">ENUM</text>
    <text x="394" y="106" class="fk">FK</text><text x="438" y="106" class="field">resident_id</text><text x="600" y="106" class="type">INT UNSIGNED</text>
