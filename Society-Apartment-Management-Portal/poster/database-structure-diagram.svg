    <text x="394" y="174" class="fk">FK</text><text x="438" y="174" class="field">flat_id</text><text x="600" y="174" class="type">INT UNSIGNED</text>
    <text x="438" y="208" class="field">is_active</text><text x="600" y="208" class="type">BOOLEAN</text>
