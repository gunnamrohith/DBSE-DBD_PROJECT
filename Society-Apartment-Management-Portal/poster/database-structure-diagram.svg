    <text x="58" y="132" class="field">phone</text><text x="220" y="132" class="type">VARCHAR(15)</text>
    <text x="58" y="163" class="field">staff_type</text><text x="220" y="163" class="type">ENUM</text>
    <text x="58" y="194" class="field">address</text><text x="220" y="194" class="type">VARCHAR(200)</text>
